# Gostwriter configuration example
# Copy this file to config.yaml and adjust values as needed.
# Environment variables in ${VAR} form are expanded.

server:
  address: ":8080"
  readTimeout: 15s
  # Transcription runs synchronously within this window; keep it above the
  # slowest expected LLM response (reasoning models on large PDFs can take
  # minutes).
  writeTimeout: 5m
  idleTimeout: 60s
  maxUploadSize: 10Mi
  workerCount: 4
  storageDir: "data"
  # Optional static API key for requests (header X-API-Key). Leave empty to disable.
  apiKey: ""
  # SQLite DB file path; default is storage_dir/gostwriter.db if empty.
  databasePath: ""
  shutdownGrace: 15s
  callbackRetries: 3
  callbackBackoff: 2s
  # Log level: debug|info|warn|error
  logLevel: "info"

llm:
  # provider: "openai" (default, transcribes images and PDFs via the Responses
  # API), "anthropic" (transcribes PDFs natively via document blocks), or "mock".
  provider: "openai"
  anthropic:
    # Point baseUrl at a reverse proxy exposing an /anthropic route or directly at
    # https://api.anthropic.com.
    # When running via Docker Compose, use host.docker.internal to reach services on the host machine.
    # This resolves to the host gateway on Docker Desktop and on Linux with Docker 20.10+.
    baseUrl: "http://host.docker.internal:8900/anthropic"
    apiKey: "${ANTHROPIC_API_KEY}"
    model: "anthropic--claude-4.5-sonnet"
    systemPrompt: ""
    instructions: ""
    temperature: 0
    # Required by the API; 0 uses a 4096 default.
    maxTokens: 0
    # HTTP client timeout for LLM requests as a Go duration string (e.g. "90s",
    # "2m", "5m"). Omit or set "0" to use the 5m default.
    timeout: "0"
  openai:
    # Point baseUrl at a reverse proxy or directly at https://api.openai.com.
    # When running via Docker Compose, use host.docker.internal to reach services on the host machine.
    # This resolves to the host gateway on Docker Desktop and on Linux with Docker 20.10+.
    # The openai provider transcribes images and PDFs via the Responses API.
    baseUrl: "http://host.docker.internal:8900"
    apiKey: "${OPENAI_API_KEY}"
    # Must be a model served over the Responses API (the gpt-5 family, e.g. gpt-5,
    # gpt-5.4, gpt-5.5). gpt-4.1 and gpt-5-mini are Chat Completions only and will
    # not work here. Choosing an unsupported model surfaces as a runtime
    # transcription error.
    model: "gpt-5"
    systemPrompt: ""
    instructions: ""
    temperature: 0
    maxTokens: 0
    # HTTP client timeout for LLM requests as a Go duration string (e.g. "90s",
    # "2m", "5m"). Omit or set "0" to use the 5m default.
    timeout: "0"
  mock:
    delay: 2s
    prefix: "Transcribed by Mock"

# Single target configuration
target:
  github:
    enabled: true
    repositoryOwner: "yourorg"
    repositoryName: "yourrepo"
    branch: "main"
    # Base path inside the repository to place the markdown (optional). Empty means repo root.
    basePath: "inbox/"
    filenameTemplate: "{{ .Timestamp.Format \"20060102-150405\" }}-{{ .JobID }}.md"
    commitMessageTemplate: "Add transcription {{ .JobID }}"
    authorName: "Gostwriter Bot"
    authorEmail: "bot@example.com"
    # Optional: override the GitHub API base URL (e.g., for GitHub Enterprise)
    apiBaseUrl: "https://api.github.com"
    # Naming strategy: "template" uses filenameTemplate (default behaviour).
    # "ai" asks the LLM for a descriptive slug (reusing the transcription
    # conversation for prompt-cache reuse), producing "YYYYMMDD-HHMMSS-<slug>.md"
    # with automatic collision avoidance. Does not require filenameTemplate.
    namingStrategy: "template"
    auth:
      token: "${GITHUB_TOKEN}"
